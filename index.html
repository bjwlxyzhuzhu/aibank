<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13293D">
<title>银行智能体超市 · 培训演示版</title>
<style>
:root{
  --bg:#EEF1EF;--paper:#FFFFFF;--soft:#F7F9F8;--ink:#13293D;--ink2:#2E4453;--muted:#4A5F6B;--muted2:#6B7F89;
  --line:#C9D3D1;--line2:#E4E9E7;--btnline:#B8C4C1;--green:#1F6E5A;--green-soft:#E3EFEA;--green-ink:#17543F;
  --seal:#B23A2B;--seal-soft:#F6E1DD;--seal-ink:#8E2B1F;--amber:#B7791F;--amber-soft:#FBF0D9;--amber-ink:#8A5A00;
  --head:#13293D;--head-ink:#EEF1EF;--head-muted:#9FB3BD;--head-on:#1E3A52;--live:#7FC4A9;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
a{color:var(--green)}a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top{background:var(--head);color:var(--head-ink);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand b{font-family:var(--serif);font-size:20px;letter-spacing:.06em}
.brand span{font-size:13px;color:var(--head-muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--head-muted);text-decoration:none;padding:6px 14px;border-radius:4px}
nav.tabs a[aria-current=page]{color:var(--head-ink);background:var(--head-on)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--live);font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:#4FB38D;display:inline-block}
.notice{background:var(--amber-soft);color:var(--amber-ink);font-size:13px}
.notice .wrap{padding-block:7px}
main{padding-block:28px 56px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--serif);font-size:34px}
h2{font-size:16px}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btnline);background:var(--paper);color:var(--ink);padding:7px 16px;border-radius:4px;cursor:pointer;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--green);color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--seal-ink);border-color:#D9A79F}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:20px}
.out{background:var(--soft);border-radius:4px;padding:14px;min-height:140px;font-size:14px;overflow-wrap:anywhere}
.out.empty{color:var(--muted2)}
.out h4{font-size:15px;margin:12px 0 4px}.out h4:first-child{margin-top:0}
.out p{margin:4px 0}.out ul{margin:4px 0;padding-left:20px}
.out table{border-collapse:collapse;margin:6px 0;font-size:13px}
.out td,.out th{border:1px solid var(--line2);padding:4px 8px;text-align:left}
textarea,input[type=text],input[type=search],input[type=number],select{width:100%;border:1px solid var(--btnline);background:var(--paper);border-radius:4px;padding:9px 12px;color:var(--ink)}
textarea{min-height:170px;resize:vertical;line-height:1.6}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--muted2)}
.alert{border-radius:4px;padding:9px 12px;font-size:14px}
.alert.bad{background:var(--seal-soft);color:var(--seal-ink)}
.alert.good{background:var(--green-soft);color:var(--green-ink)}
.alert.warn{background:var(--amber-soft);color:var(--amber-ink)}
.sens{background:var(--seal-soft);color:var(--seal-ink);padding:0 3px}
.ph-tag{color:var(--green);background:var(--green-soft);padding:0 3px;font-weight:500}
.flag mark,mark.bad{background:var(--seal-soft);color:var(--seal-ink);padding:0 2px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.t th{font-weight:500;color:var(--muted2);font-size:13px;border-bottom-color:var(--line)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}
/* 货架凭证卡 */
.shelf-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.rolebar{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:22px}
.rolebar button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 16px;color:var(--muted);cursor:pointer}
.rolebar button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-top:20px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.voucher{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:6px;min-height:190px}
.voucher.off{opacity:.7}
.stub{width:84px;flex:none;border-right:1px dashed var(--btnline);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0}
.stamp{width:58px;height:58px;border-radius:50%;border:2px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1.1}
.stamp span{font-size:11px}.stamp b{font-family:var(--serif);font-size:20px}
.lv-低{color:var(--green)}.lv-中{color:var(--amber)}.lv-高{color:var(--seal)}
.where{font-size:12px;color:var(--muted2);writing-mode:vertical-rl;letter-spacing:.2em}
.vbody{flex:1;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:7px}
.vbody h3{font-family:var(--serif);font-size:20px}
.vbody p{margin:0;color:var(--muted);font-size:14px}
.vbody .desc{flex:1}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.vfoot .save{font-size:13px;color:var(--green)}
.nextbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 18px;border:1px solid var(--line);border-radius:6px;background:var(--soft);margin-top:22px;font-size:14px;color:var(--muted)}
.nextbar b{color:var(--ink)}
/* 工作台头 */
.ws-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ws-head h1{font-size:28px}
.tagline{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:3px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.steps li{flex:1 1 200px;padding:11px 16px;border-right:1px solid var(--line);font-size:14px}
.steps li:last-child{border-right:0}
.steps li.done{background:var(--green-soft)}.steps li.done b{color:var(--green)}
.steps li span{display:block;font-size:12px;color:var(--muted)}
.redstamp{width:96px;height:96px;border-radius:50%;border:2.5px solid var(--seal);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);text-align:center;line-height:1.3;flex:none}
.redstamp b{font-family:var(--serif);font-size:15px}.redstamp span{font-size:11px}
.disclaimer{font-size:13px;color:var(--seal-ink);border-top:1px dashed #D9A79F;padding-top:8px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 12px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
/* 对话 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;font-size:15px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--head-ink);border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;white-space:normal}
.msg.ai.none{border-style:dashed;border-color:var(--amber)}
.cite{border-left:3px solid var(--green);background:#F2F7F5;padding:7px 10px;font-size:13px;color:var(--ink2);margin-top:8px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;height:46px;border-radius:22px;padding:11px 16px;background:var(--soft)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{font-size:13px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 12px;cursor:pointer}
/* 管理端 */
.kpis{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-top:20px}
.kpi{flex:1 1 200px;padding:16px 22px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi span{font-size:13px;color:var(--muted2)}.kpi b{display:block;font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
.cell{display:inline-block;min-width:64px;padding:3px 10px;border-radius:3px;font-size:13px;cursor:pointer;border:1px solid transparent}
.cell.on{background:var(--green-soft);color:var(--green-ink)}
.cell.off{background:#F2F4F3;color:var(--muted2)}
.cell.wait{border:1px dashed var(--amber);color:var(--amber-ink);cursor:default}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.doc pre{white-space:pre-wrap;margin:8px 0 0;font-family:var(--sans);font-size:13px;color:var(--muted);max-height:7.5em;overflow:hidden}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;font-size:14px;z-index:20}
footer{color:var(--muted2);font-size:12px;border-top:1px solid var(--line);padding-block:18px}
@media(max-width:640px){h1{font-size:26px}.ws-head h1{font-size:22px}.live{margin-left:0}.stub{width:70px}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#shelf"><svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="27" rx="3" fill="none" stroke="#7FC4A9" stroke-width="2"/><path d="M8 11h14M8 15h14M8 19h9" stroke="#7FC4A9" stroke-width="2" stroke-linecap="round"/></svg><b>智能体超市</b><span>培训演示版</span></a>
    <nav class="tabs" aria-label="主导航"><a href="#shelf" data-nav="shelf">货架</a><a href="#kb" data-nav="kb">本行知识库</a><a href="#admin" data-nav="admin">管理端</a></nav>
    <span class="live" id="live"><i></i>演示环境 · 仅用虚构数据</span>
  </div>
</header>
<div class="notice"><div class="wrap">本页面用于培训演示，请只输入虚构内容，不要输入真实客户信息或行内资料。正式版部署在银行内网，数据不出行。</div></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap">银行智能体超市 · 培训演示版　|　脱敏、材料核对、财务勾稽、违规用语检查在本机浏览器完成；问答与写作调用演示服务器配置的大模型，不保存对话内容。</div></footer>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toTimeString().slice(0, 8);
const toast = (t) => { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 1800); };
const store = { get(k, d) { try { const v = localStorage.getItem("aibank:" + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("aibank:" + k, JSON.stringify(v)); } catch {} } };

/* ---------- 数据 ---------- */
const ROLES = ["全部", "客户经理", "柜员", "大堂经理", "授信岗", "综合岗"];
const AGENTS = [
  { id: "mask", name: "脱敏助手", desc: "把姓名、证件号、卡号、手机号换成编号占位符，处理完一键还原。对照表只留在本机。", roles: ["客户经理", "柜员", "大堂经理", "授信岗", "综合岗"], lvl: "高", where: "本机处理", saves: "每份材料约省 5 分钟" },
  { id: "qa", name: "制度与业务知识问答", desc: "只依据本行制度库作答，每个回答都附条款出处；库里没有就直说没有。", roles: ["柜员", "大堂经理", "客户经理", "综合岗"], lvl: "低", where: "行内模型", saves: "每次约省 10 分钟" },
  { id: "script", name: "客服与营销话术助手", desc: "按产品、场景和客户类型写应答话术，自动标出承诺收益等违规用语。", roles: ["柜员", "大堂经理", "客户经理"], lvl: "低", where: "行内模型", saves: "每次约省 15 分钟" },
  { id: "minutes", name: "会议纪要与公文助手", desc: "把录音转写整理成规范纪要或通知，单列待办事项、责任人和时限。", roles: ["综合岗", "客户经理"], lvl: "中", where: "行内模型", saves: "每次约省 30 分钟" },
  { id: "credit", name: "授信辅助", desc: "核对材料清单、检查报表勾稽、起草调查报告框架。不给审批结论。", roles: ["客户经理", "授信岗"], lvl: "高", where: "行内模型", saves: "每户约省 2 小时" },
  { id: "contract", name: "合同与文本审查辅助", desc: "比对合同条款与本行范本，列出缺项和改动，供法务复核。", roles: ["授信岗"], lvl: "中", where: "行内模型", saves: "每份约省 40 分钟", soon: true }
];
const LIVE = AGENTS.filter(a => !a.soon);
const DEFAULT_DOCS = [
  { id: "d1", title: "个人存款业务操作规程（示例）", body: "第三条 大额存单起存金额为人民币20万元，期限分为1个月、3个月、6个月、1年、2年、3年。\n第四条 大额存单可在到期前办理部分提前支取，提前支取部分按支取日活期利率计息，剩余部分不低于起存金额的，按原利率继续计息。\n第五条 办理个人存款业务须核验客户本人有效身份证件；代理他人办理的，须同时核验代理人和被代理人有效身份证件。" },
  { id: "d2", title: "理财产品销售管理办法（示例）", body: "第十条 销售人员不得向客户承诺保本或者承诺最低收益，不得使用“稳赚”“无风险”“收益最高”等误导性用语。\n第十一条 向65周岁及以上客户销售理财产品，应当进行风险承受能力评估，并在销售过程中录音录像。\n第十二条 客户风险承受能力评估结果有效期为一年，过期须重新评估。" },
  { id: "d3", title: "柜面服务规范（示例）", body: "第六条 客户等候时间超过15分钟的，大堂经理应主动致歉并引导至自助设备或预约服务。\n第七条 客户投诉应当在24小时内登记，5个工作日内答复。\n第八条 柜员离开柜台须退出业务系统并锁屏。" }
];
const S = {
  role: "全部", docs: store.get("docs", null) || DEFAULT_DOCS.map(d => ({ ...d })),
  enabled: store.get("enabled", null) || Object.fromEntries(LIVE.map(a => [a.id, true])),
  log: [], mask: { map: [], masked: "" }, chat: []
};
const saveDocs = () => store.set("docs", S.docs);
const audit = (agent, action, detail) => S.log.unshift({ t: now(), agent, action, detail: String(detail || "").slice(0, 40) });

/* ---------- 大模型 ---------- */
const ERR = { 503: "演示服务器还没有配置大模型 API Key，请管理员在后台填写。", 429: "调用太频繁，请稍等一分钟再试。" };
let aiReady = null;
fetch("api/status").then(r => r.json()).then(j => { aiReady = !!j.ready; if (!aiReady) { const l = $("#live"); l.innerHTML = '<i style="background:#E3B35A"></i>AI 未配置，本机功能可用'; } }).catch(() => { aiReady = false; });
async function ask(agent, input, outEl, opts = {}) {
  const ctl = new AbortController();
  outEl.className = "out"; outEl.innerHTML = '<span class="small">正在生成…</span>';
  const stop = document.createElement("button"); stop.type = "button"; stop.className = "btn ghost"; stop.textContent = "停止"; stop.onclick = () => ctl.abort();
  outEl.before(stop);
  let text = "";
  try {
    const r = await fetch("api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agent, input }), signal: ctl.signal });
    if (!r.ok || !r.body) { let m = ERR[r.status]; try { m = (await r.json()).error || m; } catch {} throw new Error(m || "生成失败，请再试一次。"); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        let j; try { j = JSON.parse(line.slice(5)); } catch { continue; }
        if (j.error) throw new Error(j.error);
        if (j.t) { text += j.t; outEl.innerHTML = md(text); }
      }
    }
    if (!text) throw new Error("模型没有返回内容，请再试一次。");
    opts.done && opts.done(text);
    return text;
  } catch (e) {
    if (e.name === "AbortError") outEl.innerHTML = md(text) + '<p class="small">已停止。</p>';
    else outEl.innerHTML = md(text) + `<div class="alert bad">${esc(e.message)}</div>`;
    return text || null;
  } finally { stop.remove(); }
}
function md(t) {
  const lines = esc(t).split("\n"); let h = "", list = false, table = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (/^\s*\|.*\|\s*$/.test(l)) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      if (!table) { if (list) { h += "</ul>"; list = false; } h += "<div class='scroll'><table>"; table = true; }
      h += "<tr>" + l.trim().slice(1, -1).split("|").map(c => `<td>${c.trim()}</td>`).join("") + "</tr>"; continue;
    }
    if (table) { h += "</table></div>"; table = false; }
    const hd = l.match(/^#{1,4}\s+(.*)/), li = l.match(/^\s*(?:[-*•]|\d+[.、])\s+(.*)/);
    if (li) { if (!list) { h += "<ul>"; list = true; } h += `<li>${li[1]}</li>`; continue; }
    if (list) { h += "</ul>"; list = false; }

  }

}

/* ---------- 脱敏 ---------- */
function maskText(src) {
  const map = [], seen = new Map(), cnt = {};
  const put = (k, v) => { const key = k + "|" + v; if (seen.has(key)) return seen.get(key); cnt[k] = (cnt[k] || 0) + 1; const ph = `[${k}${cnt[k]}]`; seen.set(key, ph); map.push({ ph, kind: k, val: v }); return ph; };
  let t = src;
  t = t.replace(/(?<!\d)\d{17}[\dXx](?!\d)/g, m => put("证件", m));
  t = t.replace(/(?<!\d)1[3-9]\d{9}(?!\d)/g, m => put("手机", m));
  t = t.replace(/(?<!\d)0\d{2,3}-\d{7,8}(?!\d)/g, m => put("电话", m));
  t = t.replace(/(?<!\d)(?:\d[ -]?){15,18}\d(?!\d)/g, m => put("卡号", m));
  const nameRe = /(?:客户|借款人|法定代表人|联系人|担保人|配偶|申请人|客户经理|姓名[:：]?)\s*([一-龥]{2,3})(?=[，,。；;、\s（(先女的任在]|$)/g;
  const names = new Set(); let m; while ((m = nameRe.exec(t))) names.add(m[1]);
  [...names].sort((a, b) => b.length - a.length).forEach(n => { t = t.split(n).join(put("客户", n)); });
  t = t.replace(/[一-龥（）()]{2,24}?(?:股份有限公司|有限责任公司|有限公司)/g, m => { const lead = m.match(/^[任在为是由与和向的及系于即]*/)[0]; return lead + put("企业", m.slice(lead.length)); });
  t = t.replace(/(?:北京|天津|上海|重庆|河北|山西|辽宁|吉林|黑龙江|江苏|浙江|安徽|福建|江西|山东|河南|湖北|湖南|广东|海南|四川|贵州|云南|陕西|甘肃|青海|内蒙古|广西|西藏|宁夏|新疆)(?:省|市|自治区)?[一-龥\d]{2,30}?(?:号院|号楼|号|室|栋)/g, m => put("地址", m));
  return { masked: t, map };
}
const restore = (text, map) => [...map].sort((a, b) => b.ph.length - a.ph.length).reduce((t, r) => t.split(r.ph).join(r.val), text);
const BANNED = ["保本", "保证收益", "稳赚", "无风险", "零风险", "收益最高", "最高收益", "绝对安全", "肯定赚", "包赚", "刚性兑付", "保息"];
const banned = t => BANNED.filter(w => t.includes(w));

      <div class="ph"><h2>调查报告初稿</h2><button class="btn" type="button" id="cp">复制</button></div>
      <div class="out empty" id="out">核对后可生成初稿。</div>
      <p class="disclaimer">本智能体只整理材料、起草初稿，不给出是否同意授信、评级或额度建议。结论由客户经理和审查岗作出。</p></section></div>`;
  const v = k => parseFloat($("#f_" + k).value);
  let facts = "", last = "";
  $("#fill").onclick = () => { $("#cname").value = CS.name; $("#cind").value = CS.ind; $("#amt").value = CS.amt; $("#ctype").value = "流动资金贷款"; FIN.forEach(([k]) => $("#f_" + k).value = CS[k]); $$(".checks input").forEach(c => c.checked = CS.have.includes(c.value)); };
  $("#chk").onclick = () => {
    const need = REQ[$("#ctype").value], have = $$(".checks input:checked").map(c => c.value), miss = need.filter(d => !have.includes(d));
    const [ta, tl, eq, ca, cl, rev, np] = FIN.map(([k]) => v(k)), amt = parseFloat($("#amt").value);
    const items = [], ratios = [];
    if ([ta, tl, eq].every(Number.isFinite)) { const d = ta - tl - eq, ok = Math.abs(d) <= Math.max(1, ta * 0.001); items.push(ok ? ["good", `资产负债表平衡：总资产 ${ta} = 总负债 ${tl} + 所有者权益 ${eq}`] : ["bad", `资产负债表不平衡：差额 ${d.toFixed(2)} 万元，请核对报表`]); }
    else items.push(["warn", "总资产、总负债、所有者权益未填全，无法检查平衡关系"]);
    if (ta > 0 && Number.isFinite(tl)) { const r = tl / ta * 100; ratios.push(["资产负债率", r.toFixed(1) + "%", r > 70 ? "偏高，说明偿债来源" : r > 55 ? "中等" : "较低"]); }
    if (cl > 0 && Number.isFinite(ca)) { const r = ca / cl; ratios.push(["流动比率", r.toFixed(2), r < 1 ? "低于1，短期偿债需关注" : "大于1"]); }
    if (rev > 0 && Number.isFinite(np)) ratios.push(["销售净利率", (np / rev * 100).toFixed(1) + "%", "同行业对比待补充"]);
    if (rev > 0 && Number.isFinite(amt)) ratios.push(["申请金额/营业收入", (amt / rev * 100).toFixed(1) + "%", "核实采购周期与回款"]);
    if (Number.isFinite(ca) && Number.isFinite(ta) && ca > ta) items.push(["bad", "流动资产大于总资产，数据有误"]);
    $("#res").className = "out";
    $("#res").innerHTML = `<h4>材料清单（${$("#ctype").value}）</h4>${miss.length ? `<div class="alert bad">缺 ${miss.length} 项：${miss.join("、")}</div>` : '<div class="alert good">材料齐全。</div>'}
      <h4>勾稽与比率</h4>${items.map(([c, t]) => `<div class="alert ${c}" style="margin-top:6px">${esc(t)}</div>`).join("")}
      ${ratios.length ? `<div class="scroll"><table class="t" style="margin-top:8px"><thead><tr><th>指标</th><th class="num">数值</th><th>提示</th></tr></thead><tbody>${ratios.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="small">${r[2]}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
    facts = `企业：${$("#cname").value || "未填"}；行业：${$("#cind").value || "未填"}；品种：${$("#ctype").value}；申请金额：${$("#amt").value || "未填"}万元。\n已收材料：${have.join("、") || "无"}；缺项：${miss.join("、") || "无"}。\n财务数据（万元）：总资产${ta}，总负债${tl}，所有者权益${eq}，流动资产${ca}，流动负债${cl}，营业收入${rev}，净利润${np}。\n检查结果：${items.map(x => x[1]).join("；")}。比率：${ratios.map(r => r[0] + " " + r[1]).join("；")}。`;
    $("#gen").disabled = false; audit(a.name, "本机核对", `缺${miss.length}项`);
  };
  $("#gen").onclick = async () => {
    audit(a.name, "生成报告初稿", $("#cname").value);
    last = await ask("credit", { facts }, $("#out"), { done: t => { const hit = VERDICT.filter(w => t.includes(w)); if (hit.length) $("#out").insertAdjacentHTML("beforeend", `<div class="alert bad">检测到结论性表述：${hit.join("、")}。请删除后再使用。</div>`); } }) || "";
  };
  $("#cp").onclick = e => copy(last, e.target);
}

/* --- 知识库 --- */
const PI = [/(?<!\d)\d{17}[\dXx](?!\d)/, /(?<!\d)1[3-9]\d{9}(?!\d)/, /(?<!\d)(?:\d[ -]?){15,18}\d(?!\d)/];
function kbView() {
  app.innerHTML = `<h1>本行知识库</h1><p class="lede">制度问答和话术助手只依据这里的文档作答。演示版保存在你的浏览器里；正式版保存在行内服务器，并按部门和岗位设置可见范围。</p>
  <div class="cols"><section style="display:flex;flex-direction:column;gap:10px" id="docs"></section>
  <section class="panel"><h2>添加文档</h2><label class="field">文档名称<input type="text" id="dt" placeholder="例如：个人贷款管理办法（示例）"></label>
    <label class="field">正文<textarea id="db" placeholder="粘贴制度条文。添加前会自动扫描证件号、手机号和卡号。"></textarea></label>
    <div class="acts"><button class="btn primary" type="button" id="add">添加</button><button class="btn ghost" type="button" id="reset">恢复示例文档</button></div><div id="msg"></div></section></div>`;
  const draw = () => {
    $("#docs").innerHTML = S.docs.length ? S.docs.map(d => `<article class="doc"><div class="ph"><h2>${esc(d.title)}</h2><button class="btn ghost" type="button" data-del="${d.id}">下线</button></div><pre>${esc(d.body)}</pre></article>`).join("") : '<div class="doc small">知识库是空的。在右侧添加第一份文档。</div>';
    $$("[data-del]").forEach(b => b.onclick = () => { const d = S.docs.find(x => x.id === b.dataset.del); S.docs = S.docs.filter(x => x !== d); saveDocs(); audit("知识库", "下线文档", d.title); draw(); });
  };
  draw();
  $("#add").onclick = () => {
    const t = $("#dt").value.trim(), b = $("#db").value.trim();
    if (!t || !b) { $("#msg").innerHTML = '<div class="alert warn">请填写文档名称和正文。</div>'; return; }
    if (PI.some(r => r.test(b))) { $("#msg").innerHTML = '<div class="alert bad">已拦截：正文中有疑似证件号、手机号或卡号。请先用脱敏助手处理。</div>'; audit("知识库", "拦截上传", t); return; }
    S.docs.push({ id: "u" + Date.now(), title: t, body: b }); saveDocs(); audit("知识库", "添加文档", t);
    $("#dt").value = ""; $("#db").value = ""; $("#msg").innerHTML = '<div class="alert good">已添加，制度问答马上可以用。</div>'; draw();
  };
  $("#reset").onclick = () => { S.docs = DEFAULT_DOCS.map(d => ({ ...d })); saveDocs(); draw(); $("#msg").innerHTML = '<div class="alert good">已恢复示例文档。</div>'; };
}

  <div class="kpis"><div class="kpi"><span>近 30 天调用</span><b>3,097 次</b></div><div class="kpi"><span>活跃员工</span><b>86 / 104</b></div><div class="kpi"><span>估算节省</span><b>806 小时</b></div><div class="kpi"><span>拦截外发敏感信息</span><b style="color:var(--seal)">37 次</b></div></div>
  <section class="panel" style="margin-top:18px"><div class="ph"><h2>按岗位开通</h2><span class="small">点击单元格开通或关闭；关闭后货架上显示“需管理员开通”。高敏感智能体正式版需科技部与合规部双人审批。</span></div>
    <div class="scroll"><table class="t" style="min-width:720px"><thead><tr><th>岗位</th>${LIVE.map(a => `<th style="text-align:center">${a.name.replace(/与.*$|助手$/, "")}<span class="lv-${a.lvl}" style="display:block;font-size:11px">敏感度${a.lvl}</span></th>`).join("")}</tr></thead>
    <tbody>${POS.map(([p, n]) => `<tr><th scope="row" style="color:var(--ink);font-size:14px">${p}<span class="small" style="display:block">${n}</span></th>${LIVE.map(a => { const fit = a.roles.includes(p); return `<td style="text-align:center">${fit ? `<button type="button" class="cell ${S.enabled[a.id] ? "on" : "off"}" data-ag="${a.id}">${S.enabled[a.id] ? "已开通" : "未开通"}</button>` : '<span class="cell off" style="cursor:default">不适用</span>'}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></section>
  <section class="panel" style="margin-top:18px"><div class="ph"><h2>审计日志（本次演示）</h2><span class="small">只可追加，不可修改</span></div>
    <div class="scroll"><table class="t" style="min-width:640px"><thead><tr><th>时间</th><th>员工</th><th>智能体</th><th>操作</th><th>摘要</th></tr></thead><tbody>
    ${S.log.length ? S.log.map(l => `<tr><td class="num" style="text-align:left">${l.t}</td><td>演示员工</td><td>${esc(l.agent)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join("") : '<tr><td colspan="5" class="small">还没有操作记录。去货架试用任一智能体，记录会出现在这里。</td></tr>'}
    </tbody></table></div></section>`;
  $$("[data-ag]").forEach(b => b.onclick = () => { const id = b.dataset.ag; S.enabled[id] = !S.enabled[id]; store.set("enabled", S.enabled); audit("管理端", S.enabled[id] ? "开通" : "关闭", AGENTS.find(a => a.id === id).name); admin(); });
}

route();
})();
