<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d1f">
<title>银行智能体超市 · 培训演示版</title>
<style>
:root{
  --bg:#040b1c;--bg2:#071531;--panel:rgba(12,34,78,.55);--panel2:rgba(9,26,60,.72);--glass:rgba(40,110,220,.10);
  --line:rgba(96,165,250,.22);--line2:rgba(96,165,250,.38);--ink:#e8f1ff;--ink2:#b9cbe8;--muted:#7f97bd;--dim:#58709a;
  --cyan:#38d6ff;--blue:#2f7bff;--blue2:#1d4ed8;--green:#22d3a0;--amber:#fbbf24;--red:#fb7185;--violet:#a78bfa;
  --glow:0 0 0 1px rgba(56,214,255,.25),0 0 24px rgba(47,123,255,.35);
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#0c2a63 0%,transparent 60%),radial-gradient(900px 500px at 0% 30%,#0a2150 0%,transparent 55%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(80,150,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(80,150,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);z-index:0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#root{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* 顶栏 */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(4,11,28,.92),rgba(4,11,28,.7));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px 28px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo b{font-size:18px;letter-spacing:.04em;display:block;line-height:1.1}.logo small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{position:relative;display:flex;align-items:center;gap:7px;padding:9px 16px;color:var(--ink2);text-decoration:none;border-radius:8px;font-size:15px;transition:color .2s,background .2s}
.nav a:hover{color:#fff;background:rgba(47,123,255,.12)}
.nav a.on{color:#fff;background:linear-gradient(180deg,rgba(47,123,255,.35),rgba(47,123,255,.12));box-shadow:inset 0 -2px 0 var(--cyan)}
.nav svg{width:17px;height:17px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.notice{font-size:12.5px;color:#fcd9a0;background:rgba(251,191,36,.08);border-bottom:1px solid rgba(251,191,36,.18)}
.notice .wrap{padding-block:6px}
main{flex:1;padding-block:22px 56px}
footer{color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-block:16px}

/* 通用 */
h1,h2,h3{margin:0;line-height:1.25}
.panel{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);min-width:0}
.panel.glow{border-color:var(--line2);box-shadow:var(--glow)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:17px;display:flex;align-items:center;gap:9px}
.ph h2 i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 12px rgba(56,214,255,.5)}
.ph h2 i svg{width:15px;height:15px;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:rgba(47,123,255,.10);color:var(--ink);padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:rgba(47,123,255,.22);border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#3aa0ff,#1f62ff);border-color:#5fb4ff;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(31,98,255,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.pri:hover{box-shadow:0 8px 28px rgba(56,214,255,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.danger{border-color:rgba(251,113,133,.5);color:#fecdd3;background:rgba(251,113,133,.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding-inline:8px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
textarea,input[type=text],input[type=url],input[type=search],input[type=number],select{width:100%;background:rgba(3,10,26,.6);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,214,255,.15);outline:none}
select option{background:#0b1d42}
textarea{min-height:160px;resize:vertical;line-height:1.6}
::placeholder{color:#5d7398}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:rgba(47,123,255,.08);white-space:nowrap}
.chip.c{color:#a5f3fc;border-color:rgba(56,214,255,.45);background:rgba(56,214,255,.1)}
.chip.g{color:#a7f3d0;border-color:rgba(34,211,160,.45);background:rgba(34,211,160,.1)}
.chip.a{color:#fde68a;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
.chip.r{color:#fecdd3;border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.1)}
.chip.v{color:#ddd6fe;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.1)}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:13px;line-height:1}
.alert{border-radius:9px;padding:9px 12px;font-size:14px;border:1px solid;animation:fadeUp .3s}
.alert.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4);color:#fecdd3}
.alert.good{background:rgba(34,211,160,.1);border-color:rgba(34,211,160,.4);color:#bbf7d0}
.alert.warn{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:#fde68a}
.out{background:rgba(3,10,26,.55);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px;font-size:14.5px;overflow-wrap:anywhere;color:var(--ink)}
.out.empty{color:var(--dim)}
.out h4{font-size:15px;margin:12px 0 4px;color:#cfe3ff}.out h4:first-child{margin-top:0}
.out p{margin:4px 0}.out ul{margin:4px 0;padding-left:20px}
.out table{border-collapse:collapse;margin:6px 0;font-size:13px}
.out td,.out th{border:1px solid var(--line2);padding:4px 8px;text-align:left}
.ph-tag{color:#67e8f9;background:rgba(56,214,255,.14);padding:0 3px;border-radius:3px;font-weight:600}
mark.bad{background:rgba(251,113,133,.25);color:#fecdd3;padding:0 3px;border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t th{font-weight:500;color:var(--muted);font-size:13px;background:rgba(47,123,255,.06)}
.t tr{transition:background .2s}.t tbody tr:hover{background:rgba(47,123,255,.07)}
.scroll{overflow-x:auto}
.cursor::after{content:"▍";color:var(--cyan);animation:blink 1s steps(2) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(56,214,255,.5)}50%{box-shadow:0 0 0 8px rgba(56,214,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.enter{animation:fadeUp .45s both}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}

/* 首页 */
.hero{position:relative;min-height:600px;margin-top:-22px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas.stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .copy{position:relative;z-index:2;padding-top:34px;pointer-events:none}
.hero h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;letter-spacing:.02em;text-shadow:0 4px 30px rgba(47,123,255,.55)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#5fd8ff,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:8px;font-size:clamp(16px,1.6vw,21px);color:var(--ink2);letter-spacing:.12em}
.hero .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;pointer-events:auto}
.carousel{position:absolute;left:0;right:0;bottom:44px;height:268px;z-index:3;perspective:1400px}
.card3d{position:absolute;left:50%;top:0;width:212px;height:250px;margin-left:-106px;border-radius:18px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 30%,rgba(10,30,70,.6)),rgba(8,22,52,.78));border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 20px 50px rgba(0,0,0,.45),0 0 30px color-mix(in srgb,var(--ac) 35%,transparent);backdrop-filter:blur(6px);
  transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s,box-shadow .3s;will-change:transform}
.card3d.active{box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 26px 60px rgba(0,0,0,.5),0 0 60px color-mix(in srgb,var(--ac) 65%,transparent)}
.card3d .ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.5);margin-bottom:4px}
.card3d .ic svg{width:34px;height:34px;color:#fff}
.card3d h3{font-size:18px}
.card3d p{margin:0;font-size:13px;color:var(--ink2);line-height:1.5;flex:1}
.card3d .lv{font-size:11px;color:var(--muted)}
.card3d .go{border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 80%,#fff 10%),var(--ac));border:0;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 55%,transparent)}
.card3d.off{filter:grayscale(.7) brightness(.8)}
.card3d.off .go{background:rgba(255,255,255,.12);box-shadow:none;cursor:not-allowed}
.cnav{position:absolute;z-index:4;bottom:150px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:rgba(8,22,52,.7);color:#fff;cursor:pointer;display:grid;place-items:center}
.cnav.l{left:max(16px,calc(50% - 640px))}.cnav.r{right:max(16px,calc(50% - 640px))}
.roles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;position:absolute;left:0;right:0;bottom:8px;z-index:4}
.roles button{border:1px solid var(--line);background:rgba(8,22,52,.6);color:var(--ink2);padding:4px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:all .2s}
.roles button.on{color:#fff;border-color:var(--cyan);background:rgba(56,214,255,.16);box-shadow:0 0 14px rgba(56,214,255,.3)}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.run{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:rgba(3,10,26,.45);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.run:hover{transform:translateY(-2px);border-color:var(--line2)}
.run .ic{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 50%,transparent)}
.run .ic svg{width:26px;height:26px;color:#fff}
.run b{display:block}
.run .st{font-size:12.5px;color:var(--muted)}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac,var(--cyan)),#7dd3fc);transition:width .6s}
.bar.live i{background:linear-gradient(90deg,var(--ac,var(--cyan)),#e0f2fe,var(--ac,var(--cyan)));background-size:200% 100%;animation:shimmer 1.4s linear infinite}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mod{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;cursor:pointer;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 16%,rgba(3,10,26,.6)),rgba(3,10,26,.55));border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .25s,box-shadow .25s,border-color .25s;animation:fadeUp .4s both}
.mod:hover,.mod.on,.mod:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 80%,transparent);box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.mod.off{opacity:.6}
.mod .mh{display:flex;align-items:center;gap:12px}
.mod .mh>div:nth-child(2){flex:1;min-width:0}
.mod .ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 50%,transparent)}
.mod .ic svg{width:26px;height:26px;color:#fff}
.mod h3{font-size:17px}
.mod p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.6;flex:1}
.mod .mt{display:flex;gap:6px;flex-wrap:wrap}
.mod .mf{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.mod .go2{font-size:13px;font-weight:600;color:color-mix(in srgb,var(--ac) 65%,#fff);white-space:nowrap}
.mod .bar{margin-top:0}

/* 工作台 */
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--ink2);text-decoration:none}.crumb a:hover{color:#fff}
.ahead{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.15fr) minmax(260px,1fr);gap:18px;align-items:stretch}
@media(max-width:1020px){.ahead{grid-template-columns:1fr 1fr}.ahead .core{grid-column:1/-1;order:-1;min-height:260px}}
@media(max-width:640px){.ahead{grid-template-columns:1fr}}
.ainfo .top2{display:flex;gap:14px;align-items:center}
.ainfo .big{width:72px;height:72px;flex:none;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.ainfo .big svg{width:40px;height:40px;color:#fff}
.ainfo h1{font-size:26px}
.ainfo .tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ainfo p{color:var(--ink2);font-size:14px;margin:0 0 10px}
.core{position:relative;min-height:300px;border-radius:var(--r);overflow:hidden}
.core canvas{position:absolute;inset:0;width:100%;height:100%}
.core .pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(6,30,40,.7);border:1px solid rgba(34,211,160,.5);color:#bbf7d0;font-weight:600;box-shadow:0 0 18px rgba(34,211,160,.3);z-index:2;white-space:nowrap}
.core .pill.run{border-color:rgba(56,214,255,.6);color:#cffafe;box-shadow:0 0 22px rgba(56,214,255,.45)}
.core .pill.run .dot{background:var(--cyan);animation:pulse 1.2s infinite}
.timeline{list-style:none;margin:0;padding:0 0 0 24px;position:relative;max-height:236px;overflow-y:auto}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--cyan),rgba(56,214,255,.1))}
.timeline li{position:relative;display:flex;gap:12px;padding:6px 0;font-size:14px;animation:fadeUp .35s both}
.timeline li::before{content:"";position:absolute;left:-25px;top:13px;width:10px;height:10px;border-radius:50%;background:#0b1d42;border:2px solid var(--cyan);box-shadow:0 0 10px var(--cyan)}
.timeline time{font-family:var(--mono);color:var(--muted);font-size:13px;flex:none}
.timeline .empty{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(47,123,255,.12),rgba(47,123,255,.03))}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--mono);background:linear-gradient(90deg,#e0f2fe,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.steps span{flex:1 1 150px;font-size:13px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);color:var(--muted);transition:all .4s}
.steps span.done{border-color:rgba(34,211,160,.5);color:#bbf7d0;background:rgba(34,211,160,.08)}
.steps span b{display:block;color:inherit}
.stamp{width:94px;height:94px;flex:none;border-radius:50%;border:2.5px solid var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);text-align:center;line-height:1.3;font-size:11px;box-shadow:0 0 18px rgba(251,113,133,.3)}
.stamp b{font-size:15px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px;font-size:14px}
.checks label{display:flex;gap:7px;align-items:center;color:var(--ink2)}
.checks input{accent-color:var(--cyan)}
/* 对话 */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:520px;overflow-y:auto;padding:4px}
.msg{max-width:86%;padding:10px 14px;font-size:15px;animation:fadeUp .3s}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#2f7bff,#1d4ed8);color:#fff;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:rgba(3,10,26,.6);border:1px solid var(--line2);border-radius:14px 14px 14px 4px}
.msg.ai.none{border-style:dashed;border-color:rgba(251,191,36,.6)}
.cite{border-left:3px solid var(--cyan);background:rgba(56,214,255,.08);padding:7px 10px;font-size:13px;color:#cffafe;margin-top:8px;border-radius:0 6px 6px 0}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{min-height:48px;height:48px;border-radius:24px;padding:12px 18px}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,#38d6ff,#2f7bff);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 0 18px rgba(56,214,255,.45)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sugg button{font-size:13px;border:1px solid var(--line2);background:rgba(47,123,255,.08);color:var(--ink2);border-radius:999px;padding:5px 12px;cursor:pointer}
.sugg button:hover{border-color:var(--cyan);color:#fff}
.hits{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.hit{font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(3,10,26,.5);border:1px solid var(--line);animation:fadeUp .3s both}
.hit b{color:#cffafe;font-weight:600}
.hit p{margin:4px 0 0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 知识库 */
.kb{display:grid;grid-template-columns:200px 1fr;gap:18px}
@media(max-width:860px){.kb{grid-template-columns:1fr}.side{flex-direction:row!important;overflow-x:auto}}
.side{display:flex;flex-direction:column;gap:8px}
.side button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;border:1px solid transparent;background:none;color:var(--ink2);cursor:pointer;text-align:left;white-space:nowrap;transition:all .2s}
.side button:hover{background:rgba(47,123,255,.1)}
.side button.on{color:#fff;background:linear-gradient(135deg,#2f7bff,#1d4ed8);box-shadow:0 6px 20px rgba(31,98,255,.4)}
.side svg{width:18px;height:18px}
.side .n{margin-left:auto;font-size:12px;opacity:.75}
.drop{position:relative;border:1.5px dashed var(--line2);border-radius:14px;padding:26px 16px;text-align:center;transition:all .25s;background:radial-gradient(400px 160px at 50% 70%,rgba(56,214,255,.12),transparent)}
.drop.over{border-color:var(--cyan);background:radial-gradient(400px 200px at 50% 60%,rgba(56,214,255,.25),transparent);transform:scale(1.01)}
.folder{width:110px;height:84px;margin:0 auto 12px;position:relative;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.folder svg{width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(56,214,255,.6))}
.drop h3{font-size:17px}
.queue{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qi{padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(3,10,26,.45);animation:fadeUp .3s both}
.qi .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pipe{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pipe span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);transition:all .35s}
.pipe span.on{border-color:rgba(56,214,255,.6);color:#cffafe;background:rgba(56,214,255,.12);animation:pulse 1.2s infinite}
.pipe span.ok{border-color:rgba(34,211,160,.5);color:#bbf7d0;background:rgba(34,211,160,.1)}
.pipe span.err{border-color:rgba(251,113,133,.5);color:#fecdd3}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud button{border:1px solid var(--line2);background:rgba(47,123,255,.08);color:var(--ink2);border-radius:999px;padding:4px 12px;cursor:pointer;transition:all .2s}
.tagcloud button.on{border-color:var(--cyan);color:#fff;background:rgba(56,214,255,.18)}
.tagcloud button small{opacity:.7;margin-left:4px}
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(2,6,16,.55);backdrop-filter:blur(3px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.drawer .in{width:min(560px,100%);height:100%;overflow-y:auto;background:linear-gradient(180deg,#0a1d45,#06122c);border-left:1px solid var(--line2);padding:22px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
.drawer pre{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;color:var(--ink2);background:rgba(3,10,26,.5);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:55vh;overflow-y:auto}
/* 管理 */
.cell{display:inline-block;min-width:64px;padding:4px 10px;border-radius:7px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.cell.on{background:rgba(34,211,160,.14);color:#bbf7d0;border-color:rgba(34,211,160,.4)}
.cell.off{background:rgba(255,255,255,.05);color:var(--dim)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(8,22,52,.95);border:1px solid var(--cyan);color:#fff;padding:9px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--glow);animation:fadeUp .25s}
.boot{display:grid;place-items:center;min-height:70vh;color:var(--muted)}
@media(max-width:720px){
  .hero{min-height:560px}.carousel{height:250px;bottom:46px}.card3d{width:180px;height:236px;margin-left:-90px}.cnav{display:none}
  .top .wrap{gap:4px 10px;padding-block:8px;min-height:0}.nav{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav a{padding:7px 12px;font-size:14px;white-space:nowrap}.status{display:none}
  .roles{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:0 16px;scrollbar-width:none}.roles button{flex:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
